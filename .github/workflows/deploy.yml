name: Desplegar landing

# La versión y los tamaños de las descargas se leen de la última Release de gt2rz/db-bridge al
# compilar. Se publica al hacer push a main, cuando la app publica una Release
# (repository_dispatch, si su repo tiene el secreto LANDING_DISPATCH_TOKEN) y una vez al día por
# si no lo tiene. En las PRs solo se compila (es el check obligatorio del ruleset).

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [release]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Sin permisos por defecto: cada job pide solo lo que necesita.
permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# Actions fijadas por SHA (con su versión en el comentario); Dependabot las mantiene al día.

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar Astro
        run: npm run build
        env:
          # Evita el límite de la API de GitHub sin autenticar al leer la última Release.
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
